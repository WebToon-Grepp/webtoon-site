{% extends 'layout/base.html' %}

{% block content %}

<div class="container">
    <nav class="navigation">

            전체

        <a class="filter" data-filter="mon">월</a>
        <a class="filter" data-filter="tue">화</a>
        <a class="filter" data-filter="wed">수</a>
        <a class="filter" data-filter="thu">목</a>
        <a class="filter" data-filter="fri">금</a>
        <a class="filter" data-filter="sat">토</a>
        <a class="filter" data-filter="sun">일</a>
        <a class="filter" data-filter="completed">완결</a>
